name: FOSS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foss-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foss:
    name: FOSS build and unit tests
    runs-on: boat-large
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build FOSS app and run unit tests
        run: ./gradlew --console=plain :app:assembleFossDebug :app:testFossDebugUnitTest :innertube:testDebugUnitTest --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: 'true'
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            innertube/build/reports/tests/
          if-no-files-found: ignore
