name: Build iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: ["feat/ios-support"]
    paths:
      - ".github/workflows/ios-simulator.yml"
      - "iosApp/**"
      - "innertube/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradlew.bat"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build simulator app
        run: |
          chmod +x gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath iosApp/build/xcode-derived \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            iosApp/build/xcode-derived/Build/Products/Debug-iphonesimulator/Metrolist.app \
            Metrolist-ios-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: Metrolist-iOS-Simulator
          path: Metrolist-ios-simulator.zip
          if-no-files-found: error
